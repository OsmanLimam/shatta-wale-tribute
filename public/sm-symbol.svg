<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!--
    Shatta Movement (SM) emblem
    — Two interlocking S + M letterforms inside a gold diamond frame
    — Designed to echo the editorial palette: ink black, warm gold, ivory
    — The four cardinal gold marks mirror the museum-style crosshair framing
      used throughout the LegacyImage component
  -->
  <defs>
    <linearGradient id="sm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b765"/>
      <stop offset="50%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#8a6f2e"/>
    </linearGradient>
  </defs>

  <!-- Background fill -->
  <rect width="240" height="240" fill="#0a0a0a"/>

  <!-- Diamond frame (outer) -->
  <rect x="20" y="20" width="200" height="200" transform="rotate(45 120 120)" stroke="url(#sm-gold)" stroke-width="2" fill="none"/>

  <!-- Diamond frame (inner, hairline) -->
  <rect x="32" y="32" width="176" height="176" transform="rotate(45 120 120)" stroke="#c9a24b" stroke-width="0.5" fill="none" opacity="0.5"/>

  <!-- Cardinal gold marks (museum crosshair) -->
  <circle cx="120" cy="14" r="2.5" fill="#c9a24b"/>
  <circle cx="120" cy="226" r="2.5" fill="#c9a24b"/>
  <circle cx="14" cy="120" r="2.5" fill="#c9a24b"/>
  <circle cx="226" cy="120" r="2.5" fill="#c9a24b"/>

  <!-- SM monogram — designed as a single iconic mark -->
  <!-- S-curve (left side) -->
  <path d="M 78 78 Q 60 78 60 96 Q 60 114 78 120 Q 96 126 96 144 Q 96 162 78 162 L 60 162"
        stroke="url(#sm-gold)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- M-form (right side, three peaks) -->
  <path d="M 120 162 L 120 78 L 144 120 L 168 78 L 168 162"
        stroke="#f4efe6" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Underline accent -->
  <line x1="56" y1="186" x2="184" y2="186" stroke="#c9a24b" stroke-width="1" opacity="0.6"/>

  <!-- Tiny mono-caps label -->
  <text x="120" y="208" text-anchor="middle" font-family="monospace" font-size="9" fill="#c9a24b" letter-spacing="3" font-weight="bold">SHATTA MOVEMENT</text>
</svg>
